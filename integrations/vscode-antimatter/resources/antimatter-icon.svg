<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#9d4edd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" stroke="url(#glow)" stroke-width="3"/>

  <!-- Atom symbol - outer ring -->
  <ellipse cx="64" cy="64" rx="40" ry="15" fill="none" stroke="url(#glow)" stroke-width="2" transform="rotate(0 64 64)" opacity="0.8"/>
  <ellipse cx="64" cy="64" rx="40" ry="15" fill="none" stroke="url(#glow)" stroke-width="2" transform="rotate(60 64 64)" opacity="0.8"/>
  <ellipse cx="64" cy="64" rx="40" ry="15" fill="none" stroke="url(#glow)" stroke-width="2" transform="rotate(120 64 64)" opacity="0.8"/>

  <!-- Center nucleus with checkmark -->
  <circle cx="64" cy="64" r="18" fill="url(#glow)" opacity="0.9"/>

  <!-- Checkmark -->
  <path d="M54 64 L61 71 L75 55" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Electron dots -->
  <circle cx="104" cy="64" r="4" fill="#00d4ff"/>
  <circle cx="44" cy="34" r="4" fill="#9d4edd"/>
  <circle cx="44" cy="94" r="4" fill="#00d4ff"/>
</svg>
